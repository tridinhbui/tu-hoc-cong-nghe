name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Regenerates lib/lessons-data from lib/lessons.ts, then fails if any
      # lesson is below the minimum content bar (quiz count, explanation
      # length, opening question, and a diagram or interactiveType). Gating
      # here rather than in prebuild keeps local dev loops unblocked while
      # still catching new lessons that skip a diagram.
      - run: npm run audit:lessons
