name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Token cũng phải có ở bước build, không chỉ ở bước deploy: wrangler mở
      # một phiên proxy từ xa cho các binding `remote` ngay lúc `next build`,
      # và trong môi trường không tương tác nó thoát với "it's necessary to set
      # a CLOUDFLARE_API_TOKEN environment variable". Thiếu dòng này, mọi lượt
      # deploy từ 30/09 đều đỏ ở đây và production chỉ đổi khi có người deploy
      # tay.
      - name: Build Worker
        run: npm run cf:build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
